<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Taste Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; display: none; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body id="admin-body" class="p-6">

    <header class="max-w-md mx-auto mb-8">
        <h1 class="text-2xl font-black text-orange-500">Kitchen Manager</h1>
        <p class="text-slate-400 text-xs">Tap to toggle availability</p>
    </header>

    <div class="max-w-md mx-auto grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-5 rounded-3xl">
            <span class="text-[10px] uppercase font-bold text-slate-500">Live Items</span>
            <div id="active-stat" class="text-3xl font-black">0</div>
        </div>
        <div class="glass p-5 rounded-3xl border-red-500/20">
            <span class="text-[10px] uppercase font-bold text-slate-500">Sold Out</span>
            <div id="soldout-stat" class="text-3xl font-black text-red-500">0</div>
        </div>
    </div>

    <div id="admin-list" class="max-w-md mx-auto space-y-4 pb-20">
        </div>

    <script>
        const SUPABASE_URL = 'https://objfcxelxmdsmvxxgdir.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9iamZjeGVseG1kc212eHhnZGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTA5MTgsImV4cCI6MjA4ODk2NjkxOH0.fxqJ_qFDJEGjcCjioJV2zIYR9F8c59v2blg7uVy9T50';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Password Protection
        const password = prompt("Enter Manager Password:");
        if (password === "1234") { // Change 1234 to your preferred pin
            document.getElementById('admin-body').style.display = 'block';
            renderAdmin();
        } else {
            alert("Incorrect Password");
            window.location.href = "index.html"; 
        }

        async function renderAdmin() {
            const list = document.getElementById('admin-list');
            const { data: items, error } = await supabase.from('menu_items').select('*').order('name');

            if (error) return;

            // 2. Update Stats
            document.getElementById('active-stat').innerText = items.filter(i => i.is_available).length;
            document.getElementById('soldout-stat').innerText = items.filter(i => !i.is_available).length;

            list.innerHTML = items.map(item => `
                <div class="glass p-4 rounded-3xl flex items-center justify-between border-l-4 ${item.is_available ? 'border-green-500' : 'border-red-500'}">
                    <div class="flex items-center gap-3">
                        <img src="${item.image_url}" class="w-10 h-10 rounded-full object-cover">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-[10px] text-slate-500">₦${item.price}</p>
                        </div>
                    </div>
                    <button onclick="toggleStatus('${item.id}', ${item.is_available})" 
                        class="px-4 py-2 rounded-xl text-[10px] font-bold uppercase transition-all ${item.is_available ? 'bg-green-500/10 text-green-500' : 'bg-red-600 text-white shadow-lg shadow-red-900/40'}">
                        ${item.is_available ? 'In Stock' : 'Sold Out'}
                    </button>
                </div>
            `).join('');
        }

        async function toggleStatus(id, current) {
            const { error } = await supabase
                .from('menu_items')
                .update({ is_available: !current })
                .eq('id', id);
            
            if (!error) renderAdmin(); // Refresh list & stats
        }
    </script>
</body>
</html>
